<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NUAM Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #fe924a, #fe9752);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="mb-3 text-center">NUAM Exchange</h3>
        <p class="text-muted text-center">Ingreso al sistema tributario</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña">
            </div>
            <button type="submit" class="btn w-100" style="background-color: #ff6600; border-color: #ff6600; color: white;">Ingresar</button>
        </form>
    </div>
</body>
</html>
